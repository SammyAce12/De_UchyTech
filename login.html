<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | De_UchyTech</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    .auth-page { min-height: 100vh; padding: 110px 16px 40px; background: radial-gradient(circle at 85% 10%, rgba(232,255,0,0.08), transparent 40%); }
    .auth-shell { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; }
    .auth-panel, .auth-form { background: var(--card-bg); border: 1px solid var(--border); padding: 22px; }
    .auth-kicker { font-family: 'Space Mono', monospace; font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
    .auth-title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(38px, 6vw, 68px); line-height: 0.95; margin-bottom: 10px; }
    .auth-copy { color: rgba(240,237,230,0.7); line-height: 1.7; font-size: 0.92rem; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab { flex: 1; border: 1px solid var(--border); background: transparent; color: var(--text); padding: 9px; font-family: 'Space Mono', monospace; font-size: 0.68rem; letter-spacing: .1em; text-transform: uppercase; }
    .tab.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
    .auth-form label { display: block; margin: 10px 0 6px; font-family: 'Space Mono', monospace; font-size: .64rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
    .auth-form input { width: 100%; background: #0f0f0f; border: 1px solid var(--border); color: var(--text); padding: 11px; }
    .auth-form input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
    .auth-actions { display: flex; gap: 8px; margin-top: 14px; }
    .auth-actions button { flex: 1; }
    .status { min-height: 20px; margin-top: 10px; font-size: 0.82rem; color: #ff6b6b; }
    .note { margin-top: 12px; font-size: .76rem; color: rgba(240,237,230,0.55); }
    .admin-link { margin-top: 10px; display:inline-block; font-family:'Space Mono', monospace; font-size:.68rem; color:var(--accent); text-decoration:none; }
    @media (max-width: 900px) { .auth-shell { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="cursor"></div>
  <div id="cursor-ring"></div>
  <nav>
    <a class="nav-logo" href="index.html">De_UchyTech</a>
    <button class="nav-menu-btn" id="navMenuBtn" aria-label="Toggle navigation" aria-controls="navLinks" aria-expanded="false" onclick="toggleMenu()"><span></span><span></span><span></span></button>
    <div class="nav-links" id="navLinks"><a href="shop.html">Shop</a><a href="deals.html">Deals</a><a href="compare.html">Compare</a><a href="reviews.html">Reviews</a></div>
    <button class="nav-cta" onclick="window.location.href='index.html'">Home</button>
  </nav>

  <section class="auth-page">
    <div class="auth-shell">
      <div class="auth-panel">
        <div class="auth-kicker">Customer Access</div>
        <h1 class="auth-title">Login Or Create<br><span style="color:var(--accent)">Your Account</span></h1>
        <p class="auth-copy">Sign in to continue checkout, track orders, and save your selected PCs. New buyer accounts can be created in seconds.</p>
        <a class="admin-link" href="/admin-login.html">Seller? Go to Admin Login</a>
      </div>

      <div class="auth-form">
        <div class="tabs">
          <button class="tab active" id="loginTab" type="button">Login</button>
          <button class="tab" id="registerTab" type="button">Sign Up</button>
        </div>
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Your full name" style="display:none" />
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="you@example.com" />
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Password" />
        <div class="auth-actions">
          <button class="btn-primary" id="submitBtn" type="button">Login</button>
          <button class="btn-ghost" id="switchBtn" type="button">Switch To Sign Up</button>
        </div>
        <div class="status" id="status"></div>
        <p class="note">By continuing, you can access secure checkout on selected products.</p>
      </div>
    </div>
  </section>

  <script src="auth.js">
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursor-ring');
    if (cursor && ring) {
      let mx = 0; let my = 0; let rx = 0; let ry = 0;
      document.addEventListener('mousemove', (e) => {
        mx = e.clientX; my = e.clientY;
        cursor.style.left = mx + 'px';
        cursor.style.top = my + 'px';
      });
      (function animRing(){
        rx += (mx - rx) * 0.15;
        ry += (my - ry) * 0.15;
        ring.style.left = rx + 'px';
        ring.style.top = ry + 'px';
        requestAnimationFrame(animRing);
      })();
      document.querySelectorAll('button, a, input, textarea, select').forEach((el) => {
        el.addEventListener('mouseenter', () => { cursor.style.width = '20px'; cursor.style.height = '20px'; });
        el.addEventListener('mouseleave', () => { cursor.style.width = '12px'; cursor.style.height = '12px'; });
      });
    }
  </script>
  <script>
    const navRoot = document.querySelector('nav');
    const navMenuBtn = document.getElementById('navMenuBtn');
    function toggleMenu() { if (!navRoot || !navMenuBtn) return; const isOpen = navRoot.classList.toggle('nav-open'); navMenuBtn.setAttribute('aria-expanded', String(isOpen)); }

    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const switchBtn = document.getElementById('switchBtn');
    const statusEl = document.getElementById('status');
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const nextPath = new URLSearchParams(window.location.search).get('next');
    let isRegister = false;

    function syncMode() {
      nameInput.style.display = isRegister ? 'block' : 'none';
      submitBtn.textContent = isRegister ? 'Create Account' : 'Login';
      switchBtn.textContent = isRegister ? 'Switch To Login' : 'Switch To Sign Up';
      loginTab.classList.toggle('active', !isRegister);
      registerTab.classList.toggle('active', isRegister);
      statusEl.textContent = '';
    }

    loginTab.addEventListener('click', () => { isRegister = false; syncMode(); });
    registerTab.addEventListener('click', () => { isRegister = true; syncMode(); });
    switchBtn.addEventListener('click', () => { isRegister = !isRegister; syncMode(); });

    submitBtn.addEventListener('click', async () => {
      statusEl.textContent = '';
      try {
        const payload = { email: emailInput.value.trim(), password: passwordInput.value };
        const endpoint = isRegister ? '/api/auth/register' : '/api/auth/login';
        if (isRegister) payload.name = nameInput.value.trim();
        const res = await apiRequest(endpoint, { method: 'POST', body: JSON.stringify(payload) });
        if (res.user.role === 'seller') window.location.href = '/admin-dashboard.html';
        else window.location.href = nextPath || '/index.html';
      } catch (error) { statusEl.textContent = error.message; }
    });

    syncMode();
  
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursor-ring');
    if (cursor && ring) {
      let mx = 0; let my = 0; let rx = 0; let ry = 0;
      document.addEventListener('mousemove', (e) => {
        mx = e.clientX; my = e.clientY;
        cursor.style.left = mx + 'px';
        cursor.style.top = my + 'px';
      });
      (function animRing(){
        rx += (mx - rx) * 0.15;
        ry += (my - ry) * 0.15;
        ring.style.left = rx + 'px';
        ring.style.top = ry + 'px';
        requestAnimationFrame(animRing);
      })();
      document.querySelectorAll('button, a, input, textarea, select').forEach((el) => {
        el.addEventListener('mouseenter', () => { cursor.style.width = '20px'; cursor.style.height = '20px'; });
        el.addEventListener('mouseleave', () => { cursor.style.width = '12px'; cursor.style.height = '12px'; });
      });
    }
  </script>
</body>
</html>
