<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout | De_UchyTech</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    .checkout-page { min-height: 100vh; padding: 110px 16px 40px; }
    .checkout-shell { max-width: 1100px; margin: 0 auto; }
    .title { font-family:'Bebas Neue', sans-serif; font-size: clamp(42px,6vw,74px); line-height: .95; margin-bottom: 14px; }
    .sub { color: rgba(240,237,230,.65); margin-bottom: 18px; }
    .grid { display:grid; grid-template-columns: 1.2fr 1fr; gap: 14px; }
    .panel { background: var(--card-bg); border:1px solid var(--border); padding: 16px; }
    .panel h2 { font-family:'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: .04em; margin-bottom: 10px; }
    .item { display:grid; grid-template-columns: 62px 1fr auto; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); }
    .item img { width:62px; height:62px; object-fit:cover; }
    .item .name { font-family:'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing:.03em; }
    .item .brand { font-size:.74rem; color: var(--muted); font-family:'Space Mono', monospace; letter-spacing:.08em; }
    .item .price { font-family:'Space Mono', monospace; color: var(--accent); font-size: .78rem; }
    .field { margin-bottom: 10px; }
    .field label { display:block; margin: 0 0 5px; font-family:'Space Mono', monospace; font-size:.64rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
    .field input { width:100%; background:#0f0f0f; border:1px solid var(--border); color:var(--text); padding:11px; }
    .field input:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
    .sum { display:flex; justify-content:space-between; margin: 9px 0; font-family:'Space Mono', monospace; font-size:.72rem; color: var(--muted); letter-spacing:.08em; text-transform:uppercase; }
    .sum.total { font-size:1rem; color:var(--text); font-weight:700; }
    .sum.total span:last-child { color: var(--accent); }
    .pay-btn { width:100%; margin-top:8px; }
    .status { min-height:20px; margin-top:10px; font-size:.82rem; color:#ff6b6b; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="cursor"></div>
  <div id="cursor-ring"></div>
  <nav>
    <a class="nav-logo" href="index.html">De_UchyTech</a>
    <button class="nav-menu-btn" id="navMenuBtn" aria-label="Toggle navigation" aria-controls="navLinks" aria-expanded="false" onclick="toggleMenu()"><span></span><span></span><span></span></button>
    <div class="nav-links" id="navLinks"><a href="shop.html">Shop</a><a href="deals.html">Deals</a><a href="compare.html">Compare</a><a href="reviews.html">Reviews</a></div>
    <button class="nav-cta" onclick="window.location.href='shop.html'">Continue Shopping</button>
  </nav>

  <section class="checkout-page">
    <div class="checkout-shell">
      <h1 class="title">Secure Checkout</h1>
      <p class="sub">Review your selected PCs and complete your order details.</p>
      <div class="grid">
        <div class="panel">
          <h2>Order Items</h2>
          <div id="items"></div>
        </div>
        <div class="panel">
          <h2>Payment Details</h2>
          <div class="field"><label>Full Name</label><input id="fullName" type="text" placeholder="Your full name" /></div>
          <div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com" /></div>
          <div class="field"><label>Phone</label><input id="phone" type="tel" placeholder="080..." /></div>
          <div class="field"><label>Delivery Address</label><input id="address" type="text" placeholder="Street, City, State" /></div>
          <div class="sum"><span>Items</span><span id="count">0</span></div>
          <div class="sum total"><span>Total</span><span id="total">N0</span></div>
          <button class="btn-primary pay-btn" id="payBtn" type="button">Proceed To Payment</button>
          <div class="status" id="status"></div>
        </div>
      </div>
    </div>
  </section>

  <script>
    const CART_STORAGE_KEY = 'de_uchytech_cart';
    const navRoot = document.querySelector('nav');
    const navMenuBtn = document.getElementById('navMenuBtn');
    function toggleMenu() { if (!navRoot || !navMenuBtn) return; const isOpen = navRoot.classList.toggle('nav-open'); navMenuBtn.setAttribute('aria-expanded', String(isOpen)); }

    function naira(v) {
      return new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 }).format(v || 0);
    }

    async function requireBuyer() {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (!res.ok) throw new Error('Login required');
        const data = await res.json();
        if (data.user.role === 'seller') throw new Error('Buyer account required for checkout');
        return data.user;
      } catch {
        const next = encodeURIComponent('/checkout.html');
        window.location.href = `/login.html?next=${next}`;
        return null;
      }
    }

    function readCart() {
      try {
        const raw = localStorage.getItem(CART_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch { return []; }
    }

    function renderCart(cart) {
      items.innerHTML = cart.map((item) => `
        <div class="item">
          <img src="${item.image}" alt="${item.name}" />
          <div><div class="name">${item.name}</div><div class="brand">${item.brand}</div></div>
          <div class="price">${naira(item.price)}</div>
        </div>
      `).join('');

      count.textContent = cart.length;
      const totalValue = cart.reduce((sum, i) => sum + (Number(i.price) || 0), 0);
      total.textContent = naira(totalValue);
      return totalValue;
    }

    (async function boot() {
      const user = await requireBuyer();
      if (!user) return;

      fullName.value = user.name || '';
      email.value = user.email || '';

      const cart = readCart();
      if (!cart.length) {
        status.textContent = 'Your cart is empty. Please add items before checkout.';
      }

      const totalValue = renderCart(cart);

      payBtn.addEventListener('click', () => {
        if (!fullName.value.trim() || !email.value.trim() || !phone.value.trim() || !address.value.trim()) {
          status.textContent = 'Please complete all checkout fields.';
          return;
        }
        if (!cart.length) {
          status.textContent = 'Your cart is empty.';
          return;
        }

        status.style.color = '#9cff7a';
        status.textContent = `Order received for ${naira(totalValue)}. Payment gateway can be connected next.`;
      });
    })();
  
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursor-ring');
    if (cursor && ring) {
      let mx = 0; let my = 0; let rx = 0; let ry = 0;
      document.addEventListener('mousemove', (e) => {
        mx = e.clientX; my = e.clientY;
        cursor.style.left = mx + 'px';
        cursor.style.top = my + 'px';
      });
      (function animRing(){
        rx += (mx - rx) * 0.15;
        ry += (my - ry) * 0.15;
        ring.style.left = rx + 'px';
        ring.style.top = ry + 'px';
        requestAnimationFrame(animRing);
      })();
      document.querySelectorAll('button, a, input, textarea, select').forEach((el) => {
        el.addEventListener('mouseenter', () => { cursor.style.width = '20px'; cursor.style.height = '20px'; });
        el.addEventListener('mouseleave', () => { cursor.style.width = '12px'; cursor.style.height = '12px'; });
      });
    }
  </script>
</body>
</html>
