<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | De_UchyTech</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    .wrap { min-height: 100vh; padding: 110px 16px 40px; display:grid; place-items:center; }
    .card { width:min(520px,100%); background:var(--card-bg); border:1px solid var(--border); padding:22px; }
    .kicker { font-family:'Space Mono', monospace; font-size:.66rem; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
    h1 { font-family:'Bebas Neue', sans-serif; font-size:52px; line-height:.95; margin-bottom:8px; }
    p { color:rgba(240,237,230,.7); margin-bottom:14px; }
    label { display:block; margin:8px 0 5px; font-family:'Space Mono', monospace; font-size:.64rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
    input { width:100%; background:#0f0f0f; border:1px solid var(--border); color:var(--text); padding:11px; }
    .row { display:flex; gap:8px; margin-top:14px; }
    .row button { flex:1; }
    .status { min-height:20px; margin-top:10px; color:#ff6b6b; font-size:.82rem; }
  </style>
</head>
<body>
  <div id="cursor"></div>
  <div id="cursor-ring"></div>
  <nav><a class="nav-logo" href="index.html">De_UchyTech</a><div class="nav-links" id="navLinks"><a href="shop.html">Shop</a><a href="deals.html">Deals</a><a href="compare.html">Compare</a><a href="reviews.html">Reviews</a></div><button class="nav-cta" onclick="window.location.href='login.html'">Buyer Login</button></nav>
  <main class="wrap"><section class="card"><div class="kicker">Seller Access</div><h1>Admin Login</h1><p>Sign in with seller credentials to manage products, content, and orders.</p><label>Email</label><input id="email" type="email" placeholder="seller@deuchytech.com" /><label>Password</label><input id="password" type="password" placeholder="Password" /><div class="row"><button class="btn-primary" id="loginBtn" type="button">Login</button><button class="btn-ghost" type="button" onclick="window.location.href='index.html'">Back</button></div><div class="status" id="status"></div></section></main>
  <script src="auth.js">
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursor-ring');
    if (cursor && ring) {
      let mx = 0; let my = 0; let rx = 0; let ry = 0;
      document.addEventListener('mousemove', (e) => {
        mx = e.clientX; my = e.clientY;
        cursor.style.left = mx + 'px';
        cursor.style.top = my + 'px';
      });
      (function animRing(){
        rx += (mx - rx) * 0.15;
        ry += (my - ry) * 0.15;
        ring.style.left = rx + 'px';
        ring.style.top = ry + 'px';
        requestAnimationFrame(animRing);
      })();
      document.querySelectorAll('button, a, input, textarea, select').forEach((el) => {
        el.addEventListener('mouseenter', () => { cursor.style.width = '20px'; cursor.style.height = '20px'; });
        el.addEventListener('mouseleave', () => { cursor.style.width = '12px'; cursor.style.height = '12px'; });
      });
    }
  </script>
  <script>
    loginBtn.addEventListener('click', async () => {
      status.textContent = '';
      try {
        const res = await apiRequest('/api/auth/login', { method:'POST', body: JSON.stringify({ email: email.value.trim(), password: password.value }) });
        if (res.user.role !== 'seller') throw new Error('Seller account required for admin access');
        window.location.href = '/admin-dashboard.html';
      } catch (e) { status.textContent = e.message; }
    });
  
    const cursor = document.getElementById('cursor');
    const ring = document.getElementById('cursor-ring');
    if (cursor && ring) {
      let mx = 0; let my = 0; let rx = 0; let ry = 0;
      document.addEventListener('mousemove', (e) => {
        mx = e.clientX; my = e.clientY;
        cursor.style.left = mx + 'px';
        cursor.style.top = my + 'px';
      });
      (function animRing(){
        rx += (mx - rx) * 0.15;
        ry += (my - ry) * 0.15;
        ring.style.left = rx + 'px';
        ring.style.top = ry + 'px';
        requestAnimationFrame(animRing);
      })();
      document.querySelectorAll('button, a, input, textarea, select').forEach((el) => {
        el.addEventListener('mouseenter', () => { cursor.style.width = '20px'; cursor.style.height = '20px'; });
        el.addEventListener('mouseleave', () => { cursor.style.width = '12px'; cursor.style.height = '12px'; });
      });
    }
  </script>
</body>
</html>
