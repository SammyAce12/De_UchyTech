<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reviews | Admin</title>
  <link rel="stylesheet" href="admin/admin.css" />
  <style>
    .split { display:grid; grid-template-columns: 360px 1fr; gap:14px; }
    .list-item { border:1px solid var(--line); border-radius:8px; padding:10px; background:#fff; margin-bottom:8px; }
    .list-item.active { border-color:#72aee6; background:#f0f6fc; }
    .list-title { font-weight:700; font-size:13px; }
    .list-meta { font-size:12px; color:var(--muted); margin:4px 0 8px; }
    .row-actions { display:flex; gap:8px; }
    .btn-small { padding:6px 9px; font-size:12px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
    .btn-add { background:#f0f6fc; border-color:#72aee6; color:#135e96; font-weight:600; }
    .btn-remove { background:#fff8f8; border-color:#e0b4b4; color:#8a2424; }
    .editor-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .grid-3 { display:grid; grid-template-columns:120px 1fr 120px; gap:10px; }
    @media (max-width:1000px){ .split{grid-template-columns:1fr;} .grid-3{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar"><div class="brand">De_UchyTech Admin</div><nav class="menu">
      <a href="admin-dashboard.html">Dashboard</a><a href="admin-content.html">Site Content</a><a href="admin-products.html">Products</a><a href="admin-reviews.html">Reviews</a><a href="admin-users.html">Users</a>
    </nav></aside>
    <main>
      <header class="topbar"><div><h1>Reviews</h1><p>Manage customer reviews displayed on reviews page.</p></div><div class="top-actions"><button class="btn btn-primary" id="saveBtn">Save</button><button class="btn btn-danger logout-btn">Logout</button></div></header>
      <section class="content">
        <div class="split">
          <div class="card">
            <div class="editor-head"><strong>Saved Reviews</strong><button id="addReviewBtn" class="btn-small btn-add" type="button">+ Add Review</button></div>
            <div id="reviewsList"></div>
          </div>
          <div class="card">
            <div class="editor-head"><strong id="editorTitle">Review Editor</strong></div>
            <div class="grid-3">
              <div><label>Stars</label><select id="rStars"><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select></div>
              <div><label>Author Name</label><input id="rAuthorName" type="text" /></div>
              <div><label>Avatar</label><input id="rAvatar" maxlength="3" type="text" /></div>
            </div>
            <label>Author Role</label><input id="rAuthorRole" type="text" />
            <label>Review Text</label><textarea id="rText"></textarea>
          </div>
        </div>
        <div id="status" class="status"></div>
      </section>
    </main>
  </div>

  <script src="auth.js"></script><script src="admin/admin-common.js"></script>
  <script>
    let contentState = null;
    let activeIndex = -1;

    function emptyReview(){ return { stars:5, text:'', authorName:'', authorRole:'', avatar:'' }; }

    function renderList(){
      const list = contentState.customerReviews || [];
      reviewsList.innerHTML = list.map((r,i)=>`<div class="list-item ${i===activeIndex?'active':''}" data-i="${i}"><div class="list-title">${r.authorName || 'Unnamed Customer'}</div><div class="list-meta">${'?'.repeat(Number(r.stars)||5)} | ${r.authorRole || 'No role'}</div><div class="row-actions"><button type="button" class="btn-small edit-btn">Edit</button><button type="button" class="btn-small btn-remove del-btn">Delete</button></div></div>`).join('');
    }

    function loadEditor(i){
      const r = contentState.customerReviews[i]; if(!r) return;
      activeIndex = i; renderList();
      editorTitle.textContent = `Editing: ${r.authorName || 'Review ' + (i+1)}`;
      rStars.value = String(Number(r.stars)||5);
      rAuthorName.value = r.authorName || '';
      rAvatar.value = (r.avatar || '').toUpperCase().slice(0,3);
      rAuthorRole.value = r.authorRole || '';
      rText.value = r.text || '';
    }

    function saveEditorToState(){
      if(activeIndex<0) return;
      contentState.customerReviews[activeIndex] = {
        stars:Number(rStars.value)||5,
        authorName:rAuthorName.value.trim(),
        avatar:rAvatar.value.trim().toUpperCase().slice(0,3),
        authorRole:rAuthorRole.value.trim(),
        text:rText.value.trim()
      };
      renderList();
    }

    reviewsList.addEventListener('click',(e)=>{
      const item = e.target.closest('.list-item'); if(!item) return;
      const i = Number(item.dataset.i);
      if(e.target.closest('.edit-btn')){ saveEditorToState(); loadEditor(i); return; }
      if(e.target.closest('.del-btn')){ contentState.customerReviews.splice(i,1); if(contentState.customerReviews.length===0){ contentState.customerReviews=[emptyReview()]; } activeIndex=Math.min(i,contentState.customerReviews.length-1); renderList(); loadEditor(activeIndex); return; }
    });

    [rStars,rAuthorName,rAvatar,rAuthorRole,rText].forEach((el)=> el.addEventListener('input', saveEditorToState));

    addReviewBtn.addEventListener('click',()=>{ saveEditorToState(); contentState.customerReviews.push(emptyReview()); loadEditor(contentState.customerReviews.length-1); });

    saveBtn.addEventListener('click', async ()=>{
      try{ saveEditorToState(); const payload={...contentState, customerReviews:contentState.customerReviews}; await apiRequest('/api/admin/content',{method:'PUT',body:JSON.stringify(payload)}); contentState=payload; setStatus('Reviews saved.','ok'); }
      catch(e){ setStatus(e.message,'error'); }
    });

    (async()=>{ const user=await requireSeller(); if(!user) return; try{ const data=await loadAdminData(); contentState=data.content; contentState.customerReviews=Array.isArray(contentState.customerReviews)&&contentState.customerReviews.length?contentState.customerReviews:[emptyReview()]; activeIndex=0; renderList(); loadEditor(0);} catch(e){ setStatus(e.message,'error'); }})();
  </script>
</body>
</html>
